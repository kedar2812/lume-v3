listen_addresses = '*'
max_connections = 50
password_encryption = scram-sha-256
shared_buffers = 2GB
effective_cache_size = 5GB
work_mem = 16MB
maintenance_work_mem = 256MB
wal_compression = on
random_page_cost = 1.1
timezone = 'UTC'
log_timezone = 'UTC'
log_min_duration_statement = 500
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %u@%d '
