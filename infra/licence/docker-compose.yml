# The licence server, on the owner's host (licensing L-B, R1): its own Compose project in /root/lume-licence,
# bound to 127.0.0.1 only. The public side (nginx for license.lumecrm.in and its certificate) is the owner's
# step: docs/runbooks/licence-server.md.
name: lume-licence

x-base: &base
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

networks:
  licence: {}

volumes:
  pgdata: {}

services:
  db:
    <<: *base
    image: postgres:17
    environment:
      POSTGRES_USER: licence
      POSTGRES_DB: licence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [licence]
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "licence", "-d", "licence"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    image: ${LICENCE_IMAGE:-lume-licence:latest}
    command: ["node", "apps/licence/dist/migrate.mjs"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    environment:
      DATABASE_URL: postgres://licence:${POSTGRES_PASSWORD:?}@db:5432/licence
    depends_on:
      db: { condition: service_healthy }
    networks: [licence]
    restart: "no"

  app:
    <<: *base
    image: ${LICENCE_IMAGE:-lume-licence:latest}
    environment:
      DATABASE_URL: postgres://licence:${POSTGRES_PASSWORD:?}@db:5432/licence
      LICENCE_KID: ${LICENCE_KID:?}
      LICENCE_MASTER_KEY_FILE: /run/secrets/master.key
      LICENCE_SIGNING_KEY_FILE: /run/secrets/signing.pem
      # The website's key for POST /v1/enquiries (website spec §7); without it the intake answers 503.
      ENQUIRY_TOKEN_FILE: /run/secrets/enquiry.token
    volumes:
      - ./secrets/signing.pem:/run/secrets/signing.pem:ro
      - ./secrets/master.key:/run/secrets/master.key:ro
      - ./secrets/enquiry.token:/run/secrets/enquiry.token:ro
    # Nothing to add or change at run time: no capabilities, a read-only filesystem, scratch space in memory.
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/licence/.next/cache
    ports:
      - "127.0.0.1:8480:8480"
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [licence]
    mem_limit: 512m
