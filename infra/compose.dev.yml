services:
  db:
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "hba_file=/etc/postgresql/pg_hba.conf",
        "-c",
        "shared_buffers=384MB",
        "-c",
        "effective_cache_size=768MB",
        "-c",
        "maintenance_work_mem=64MB",
      ]
    mem_limit: 1g
    cpus: 0.5
  migrate:
    build: { context: .., dockerfile: infra/docker/worker.Dockerfile }
  api:
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    environment:
      LUME_PUBLIC_URL: https://lume.localhost:8443
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: LUME <no-reply@lume.localhost>
    mem_limit: 512m
    cpus: 0.3
  worker:
    build: { context: .., dockerfile: infra/docker/worker.Dockerfile }
    mem_limit: 512m
    cpus: 0.3
  web:
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    environment:
      LUME_DESIGN_SHOWCASE: "1"
    mem_limit: 512m
    cpus: 0.3
  caddy:
    build: { context: .., dockerfile: infra/docker/caddy.Dockerfile }
    ports: !override
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8080:80"
    mem_limit: 128m
    cpus: 0.1
  # Dev-only mail catcher: every invite / reset / alert email lands in its inbox instead of being sent.
  # Web inbox on 127.0.0.1:8025 (reach it through `scripts/dev.sh tunnel`); SMTP stays internal on :1025.
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    networks: [backend]
    ports: ["127.0.0.1:8025:8025"]
    environment:
      MP_MAX_MESSAGES: "500"
    mem_limit: 96m
    cpus: 0.1
