name: lume

x-base: &base
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

networks:
  frontend: {}
  backend:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
  # The render service's (plan 2026-10-20-media-tab): the API and render only, and no route out of the server.
  render:
    internal: true

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
  offsite: {}
  # WhatsApp's photos, voice notes, videos and documents, each once, named by its content (2026-10-19): the API
  # writes them; the worker reads them for the off-site copy. Back it up with the database (docs/runbooks/restore.md).
  files: {}

secrets:
  restore_agekey:
    file: ${LUME_SECRETS_DIR:?}/restore.agekey

services:
  db:
    <<: *base
    image: postgres:17
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      LUME_OWNER_PASSWORD: ${LUME_OWNER_PASSWORD:?}
      LUME_APP_PASSWORD: ${LUME_APP_PASSWORD:?}
      LUME_WORKER_PASSWORD: ${LUME_WORKER_PASSWORD:?}
      LUME_BACKUP_PASSWORD: ${LUME_BACKUP_PASSWORD:?}
      LUME_RESTORE_PASSWORD: ${LUME_RESTORE_PASSWORD:?}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "hba_file=/etc/postgresql/pg_hba.conf",
      ]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks: [backend]
    shm_size: 256m
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    image: ${LUME_IMAGE_PREFIX:-lume}/worker:${LUME_TAG:-dev}
    command: ["node", "dist/migrate.js"]
    restart: "no"
    profiles: ["tools"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL_OWNER: postgres://lume_owner:${LUME_OWNER_PASSWORD:?}@db:5432/lume
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *base
    image: ${LUME_IMAGE_PREFIX:-lume}/api:${LUME_TAG:-dev}
    read_only: true
    cap_drop: ["ALL"]
    tmpfs: ["/tmp"]
    environment:
      LUME_PUBLIC_HOST: ${LUME_PUBLIC_HOST:?}
      LUME_MASTER_KEY: ${LUME_MASTER_KEY:?}
      DATABASE_URL_APP: postgres://lume_app:${LUME_APP_PASSWORD:?}@db:5432/lume
      LUME_PUBLIC_URL: ${LUME_PUBLIC_URL:-}
      SMTP_URL: ${SMTP_URL:-}
      # Google Sheets (optional module): the service-account key, base64. Unset: Sheets can't be switched on.
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      LUME_SHEETS_MAX_ROWS: ${LUME_SHEETS_MAX_ROWS:-50000}
      # Connect with Google (optional): Sheets and Calendar through the relay (docs/runbooks/connect-with-google.md §3).
      # Unset: neither Connect with Google nor Google Calendar can be switched on.
      GOOGLE_OAUTH_RELAY_URL: ${GOOGLE_OAUTH_RELAY_URL:-}
      GOOGLE_OAUTH_RELAY_TOKEN: ${GOOGLE_OAUTH_RELAY_TOKEN:-}
      LUME_META_APP_ID: ${LUME_META_APP_ID:-}
      # LUME AI (optional, spec 2026-10-18; docs/runbooks/ai.md): which provider reads notes, its model and this
      # client's own key with a spend cap. Unset: LUME AI can't be switched on.
      LUME_AI_PROVIDER: ${LUME_AI_PROVIDER:-}
      LUME_AI_MODEL: ${LUME_AI_MODEL:-}
      LUME_AI_KEY: ${LUME_AI_KEY:-}
      # LUME AI's prices (USD per million tokens) and the provider's monthly cap, for the spend the ring shows.
      LUME_AI_PRICE_IN: ${LUME_AI_PRICE_IN:-}
      LUME_AI_PRICE_OUT: ${LUME_AI_PRICE_OUT:-}
      LUME_AI_MONTHLY_CAP: ${LUME_AI_MONTHLY_CAP:-}
      MAIL_FROM: ${MAIL_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # This installation's licence (licensing L-A): from New licence on license.lumecrm.in.
      LUME_INSTANCE_ID: ${LUME_INSTANCE_ID:-}
      LUME_LICENSE_KEY: ${LUME_LICENSE_KEY:-}
      # LUME's own demo only: "true" waives two-step sign-in, honoured solely at demo.lumecrm.in (api/src/demo/mode.ts).
      LUME_DEMO_MODE: ${LUME_DEMO_MODE:-}
      # Thumbnails of the business's files, and Word, Excel and PowerPoint shown as pages (docs/runbooks/media.md).
      # Set it empty to run without: Media then shows each file by its kind.
      LUME_RENDER_URL: ${LUME_RENDER_URL-http://render:3020}
    volumes:
      - files:/var/lib/lume/files
    networks: [frontend, backend, render]
    mem_limit: 768m
    depends_on:
      db: { condition: service_healthy }

  worker:
    <<: *base
    image: ${LUME_IMAGE_PREFIX:-lume}/worker:${LUME_TAG:-dev}
    read_only: true
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:size=4g"]
    environment:
      LUME_MASTER_KEY: ${LUME_MASTER_KEY:?}
      DATABASE_URL_WORKER: postgres://lume_worker:${LUME_WORKER_PASSWORD:?}@db:5432/lume
      DATABASE_URL_BACKUP: postgres://lume_readonly_backup:${LUME_BACKUP_PASSWORD:?}@db:5432/lume
      DATABASE_URL_RESTORE: postgres://lume_restore:${LUME_RESTORE_PASSWORD:?}@db:5432/postgres
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:?}
      BACKUP_AGE_IDENTITY_FILE: /run/secrets/restore_agekey
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-local}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-offsite:/var/lib/lume/offsite}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets: [restore_agekey]
    volumes:
      - offsite:/var/lib/lume/offsite
      - files:/var/lib/lume/files:ro
    networks: [backend]
    mem_limit: 768m
    depends_on:
      db: { condition: service_healthy }

  # LibreOffice, poppler, ffmpeg and vips behind a small HTTP service: bytes in, a thumbnail or a PDF out. It reaches
  # nothing and holds nothing; each job runs in its own folder on the tmpfs under a time limit (apps/render).
  render:
    <<: *base
    image: ${LUME_IMAGE_PREFIX:-lume}/render:${LUME_TAG:-dev}
    read_only: true
    cap_drop: ["ALL"]
    tmpfs: ["/tmp:size=768m"]
    networks: [render]
    mem_limit: 1g
    pids_limit: 128

  web:
    <<: *base
    image: ${LUME_IMAGE_PREFIX:-lume}/web:${LUME_TAG:-dev}
    environment:
      LUME_API_URL: http://api:3001
    read_only: true
    cap_drop: ["ALL"]
    tmpfs: ["/tmp", "/app/apps/web/.next/cache"]
    networks: [frontend]
    mem_limit: 768m

  caddy:
    <<: *base
    image: ${LUME_IMAGE_PREFIX:-lume}/caddy:${LUME_TAG:-dev}
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    environment:
      LUME_PUBLIC_HOST: ${LUME_PUBLIC_HOST:?}
      LUME_TLS: ${LUME_TLS:-}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
    mem_limit: 128m
    depends_on: [api, web]
